<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>· · · · ·</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Press+Start+2P&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            overflow: hidden;
            background: #000;
            color: #0ff;
            font-family: 'Orbitron', sans-serif;
            height: 100vh;
            position: relative;
        }
        
        canvas { position: absolute; top: 0; left: 0; z-index: 1; }
        
        .content {
            position: relative;
            z-index: 2;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        
        .logo {
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 0.5em;
            margin-bottom: 2rem;
            text-shadow: 0 0 20px #0ff;
            opacity: 0;
            animation: glow 2s infinite alternate;
        }
        
        .teaser {
            font-family: 'Press Start 2P', cursive;
            font-size: 1.1rem;
            margin: 1.5rem 0;
            min-height: 80px;
            opacity: 0;
            transition: all 0.8s ease;
            text-shadow: 0 0 15px #f0f;
        }
        
        .reveal {
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: 0.2em;
            margin: 3rem 0 2rem;
            opacity: 0;
            text-shadow: 0 0 40px #ff0;
            animation: pulse 3s infinite;
        }
        
        .blurred-art {
            width: 320px;
            height: 320px;
            background: rgba(255,255,255,0.05);
            border: 2px solid #0ff;
            box-shadow: 0 0 60px rgba(0, 255, 255, 0.6);
            margin: 2rem 0;
            position: relative;
            overflow: hidden;
            transition: all 1s ease;
        }
        
        .blurred-art::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            animation: scan 4s linear infinite;
        }
        
        .blurred-art img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(20px) brightness(0.6);
            transition: filter 1.5s ease;
        }
        
        .active .blurred-art img { filter: blur(8px) brightness(1.2); }
        
        .scanline {
            position: absolute;
            top: -100%;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(transparent, #0ff, transparent);
            animation: scanline-anim 6s linear infinite;
            opacity: 0.3;
        }
        
        @keyframes glow { from { text-shadow: 0 0 10px #0ff; } to { text-shadow: 0 0 40px #0ff; } }
        @keyframes pulse { 0%,100% { opacity: 0.7; } 50% { opacity: 1; } }
        @keyframes scan { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
        @keyframes scanline-anim { 0% { top: -100%; } 100% { top: 300%; } }
        
        .footer {
            position: absolute;
            bottom: 30px;
            font-size: 0.8rem;
            letter-spacing: 3px;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <canvas id="space"></canvas>
    
    <div class="content">
        <div class="logo">UNPRINCIPLED INC.</div>
        
        <div class="blurred-art" id="artContainer">
            <div class="scanline"></div>
            <!-- Replace these placeholder srcs with your actual blurred images later -->
            <img id="art1" src="https://picsum.photos/id/1015/600/600" alt="Lords">
            <img id="art2" src="https://picsum.photos/id/102/600/600" alt="Nobles" style="display:none;">
            <img id="art3" src="https://picsum.photos/id/1036/600/600" alt="Peasants" style="display:none;">
        </div>
        
        <div class="teaser" id="teaser">333 LORDS AND LADIES</div>
        
        <div class="reveal" id="reveal">SOMETHING IS COMING…</div>
        
        <div class="footer">SOLANA • EST. 2026 • TRANSMISSION ACTIVE</div>
    </div>

    <script>
        // Three.js Starfield - Flying through space
        let scene, camera, renderer;
        let particles;
        
        function initSpace() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('space'), alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            
            // Stars
            const geometry = new THREE.BufferGeometry();
            const vertices = [];
            const colors = [];
            
            for (let i = 0; i < 8000; i++) {
                const x = Math.random() * 2000 - 1000;
                const y = Math.random() * 2000 - 1000;
                const z = Math.random() * 2000 - 1000;
                vertices.push(x, y, z);
                
                // Neon space colors
                const color = Math.random() > 0.7 ? new THREE.Color(0x00ffff) : 
                             (Math.random() > 0.5 ? new THREE.Color(0xff00ff) : new THREE.Color(0xffff00));
                colors.push(color.r, color.g, color.b);
            }
            
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            
            const material = new THREE.PointsMaterial({
                size: 1.8,
                vertexColors: true,
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending
            });
            
            particles = new THREE.Points(geometry, material);
            scene.add(particles);
            camera.position.z = 1;
        }
        
        function animateSpace() {
            requestAnimationFrame(animateSpace);
            
            // Fly forward effect
            particles.rotation.y += 0.0001;
            const positions = particles.geometry.attributes.position.array;
            for (let i = 2; i < positions.length; i += 3) {
                positions[i] += 3; // speed
                if (positions[i] > 1000) positions[i] = -1000;
            }
            particles.geometry.attributes.position.needsUpdate = true;
            
            renderer.render(scene, camera);
        }
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // Teaser cycling
        const teasers = [
            { text: "333 LORDS AND LADIES", imgId: "art1" },
            { text: "666 NOBLES", imgId: "art2" },
            { text: "999 PEASANTS", imgId: "art3" }
        ];
        let current = 0;
        const teaserEl = document.getElementById('teaser');
        const artContainer = document.getElementById('artContainer');
        
        function cycleTeaser() {
            current = (current + 1) % teasers.length;
            
            // Fade out
            teaserEl.style.opacity = 0;
            artContainer.classList.remove('active');
            
            setTimeout(() => {
                teaserEl.textContent = teasers[current].text;
                
                // Switch images
                document.querySelectorAll('#artContainer img').forEach(img => img.style.display = 'none');
                document.getElementById(teasers[current].imgId).style.display = 'block';
                
                // Fade in
                teaserEl.style.opacity = 1;
                artContainer.classList.add('active');
            }, 800);
        }
        
        // Initial setup & timings for suspense
        window.onload = () => {
            initSpace();
            animateSpace();
            
            // Initial fade-ins
            setTimeout(() => {
                document.querySelector('.logo').style.opacity = 1;
            }, 800);
            
            setTimeout(() => {
                artContainer.classList.add('active');
                teaserEl.style.opacity = 1;
                document.getElementById('reveal').style.opacity = 1;
            }, 1800);
            
            // Cycle teasers every 5 seconds
            setInterval(cycleTeaser, 5200);
            
            // Occasional random "glitch" on reveal text
            setInterval(() => {
                const reveal = document.getElementById('reveal');
                reveal.style.transform = 'scale(1.05)';
                setTimeout(() => reveal.style.transform = 'scale(1)', 180);
            }, 7000);
        };
    </script>
</body>
</html>
